spring:
  application:
    name: team-notes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/team_notes}
    username: ${DB_USERNAME:team_notes}
    password: ${DB_PASSWORD:team_notes}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
server:
  error:
    include-message: never
    include-stacktrace: never
